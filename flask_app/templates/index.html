<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <title>Jr</title>
</head>
<body>

    {% if messages and messages|length > 0 %}

    <section>

        <div class="response">

            {% for message in messages %}

                {% if message.role == "user" %}

                <div class="user">
                    <p>{{message.text}}</p>
                </div>

            {% else %}

                <div class="ai">
                    <p>{{ message.text }} </p>

                </div>

             {% endif %}
            
            {% endfor %}

        </div>

             <div id="loading" style="display: none;">
                        Jr is thinking
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
      



          <form id="chat-form" action="/chat" method="post" class="col-6 mx-auto"> 
                        <br>
                    <textarea id="prompt" name="prompt" class="input form-control" placeholder="Ask Away!" required></textarea>
                        <br>
                    <input id="submit" type="submit" value="submit" class="btn btn-light">
                </form>
    </section>

    {% else %}

        <section>
            <div class="no-chat">
                <form id="chat-form" action="/chat" method="post" class="col-6 mx-auto"> 
                    <h3>Hello! How can I assist you today?</h3>
                        <br>
                    <textarea id="prompt" name="prompt" class="input form-control" placeholder="Ask Away!" required></textarea>
                        <br>
                    <input id="submit" type="submit" value="submit" class="btn btn-light">
                </form>
            </div>
    </section>
    {% endif %}

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
