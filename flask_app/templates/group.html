<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/group.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="shortcut icon" type="image/x-icon" href="{{url_for('static', filename='favicon.ico') }}">
    <title>Skier's Choice | Chat</title>
</head>
<body>

    <section class="display">
    <div class="group-list">
        <img src="{{ url_for('static', filename='icons/brand.png') }}" class="brand" alt="Profile Picture">
        <div class="group-row">
             <a class="group-item" href="/chatroom">+ New Chat</a>
        </div>
        {% for group in groups %}
        <div class="group-row">
            <a class="group-item" href="/chatroom/{{ group.id }}">{{ group.title }}</a>

            <form class="rename-form" action="/rename-chat/{{ group.id }}" method="post" style="display: none;">
                <input type="text" name="title" value="{{ group.title }}" class="rename-title">
            </form>

            <button class="extras">⋮</button>      
        </div>
        {% endfor %}
        <div class="nameplate">
            👤 {{user.full_name}}
            <button class="profile">⋮</button>      
        </div>
    </div>
  
    {% if chats and chats|length > 0 %}
        <section class="chat">
            <div class="response" id="response">
                {% for chat in chats %}
                    <div class="user">
                        <p>{{ chat.prompt }}</p>
                    </div>
            
                    <div class="ai">
                        <p>{{ chat.response }}</p>
                         <button class="speak-btn" title="Read aloud">🔊</button>
                    </div>
                {% endfor %}
            </div>

            <form id="chat-form" action="/chat" method="post" class="col-3 mx-auto"> 
                 <div id="loading" style="display:none;">         
                    <div class="thinking-ball"></div>     
                </div> 
                <input type="hidden" name="group_id" value="{{ group.id }}">
                    <br>
                <div class="input-wrapper">
                    <textarea id="prompt" name="prompt" class="input form-control" placeholder="Ask Away!" required></textarea>
                    <input id="submit" type="submit" value="↑">
                </div>
            </form>
        </section>
    {% endif %}

      </section>


      <div id="context-menu" class="menu">        
            <button id="rename-chat">✏ Rename</button>

        <form action='/clear-chat/{{ group.id }}' method="POST">
            <button type="submit" class="delete-btn">🗑 Delete</button>
        </form>
      </div>

       <div id="context-profile-menu" class="menu">         
        <button id="open-profile"> Profile</button>         
        <a href="/logout" class="logout">Logout</a>  
      </div>


      <section id="profile-menu">
        <form action="/update/{{user.id}}" method="post" id="profile-form" class="col-6 mx-auto"> 
                <h1 id="update-title">User Information</h1>
                <br>

            <label for="full_name">Full Name:</label>
            <input type="text" name="full_name" class="form-control" value="{{user.full_name}}"> 
    
            <label for="email">Email:</label>
            <input type="text" name="email" class="form-control" value="{{user.email}}" autocomplete="username">

            <br>
            <div id="buttons">
                <input id="update" type="submit" value="Update">
                </form>
                  <form action='/delete_account/{{ user.id }}' method="POST" onsubmit="return confirmDelete()">
                    <button type="submit" id="delete-button">Delete Account</button>
                </form>
            </div>
            <p class="sub-link">Change password? <a href="/forgot_password">Click Here!</a></p>  
      </section>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
