<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/password.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="shortcut icon" type="image/x-icon" href="{{url_for('static', filename='favicon.ico') }}">
    
</head>
<body>
    <br>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class='alert' onclick="popOut(this)">
                    {% for message in messages %}
                        <p>{{message}}</p>
                        <button id="submit">I Accept</button>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <section>
            <form method="POST" action="/reset_password"  class="reset-form">
                <h1>Forgot Your Password?</h1>
                    <br>
                <div class="container">
                   <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" id="submit-btn">Send Reset Link</button>   
                <p><a href="/">Back to Login</a></p>
            </form>
        </section>    
<script type="text/javascript" src="{{ url_for('static', filename='js/index.js') }}"></script> 
</body>
</html>
