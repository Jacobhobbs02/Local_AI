<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/password.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="shortcut icon" type="image/x-icon" href="{{url_for('static', filename='favicon.ico') }}">
    
</head>
<body>
    <br>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class='alert' onclick="popOut(this)">
                    {% for message in messages %}
                        <p>{{message}}</p>
                        <button id="submit">I Accept</button>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <section>
            <form method="POST" action="/new_password/{{ token }}"  class="reset-form">
                <h1>Update Password</h1>
                    <br>
                <div class="container">
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password">
                    <img src="{{url_for('static', filename='icons/show_button.png') }}" onclick="togglePasswordVisibility('password', 'togglePassword')" id="togglePassword" class="show-password-btn" alt="Show Button" placeholder="Enter your new password">
                </div>
                    <br>
                <div class="container">
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" name="confirm" id="confirm_password">
                    <img src="{{url_for('static', filename='icons/show_button.png') }}" onclick="toggleConfirmPasswordVisibility('confirm_password', 'togglePassword')" id="toggleConfirmPassword" class="show-password-btn" alt="Show Button">
                </div>
                <button type="submit" id="submit-btn">Reset Password</button> 
                <p><a href="/">Back to Login</a></p>
            </form>
        </section>    
<script type="text/javascript" src="{{ url_for('static', filename='js/index.js') }}"></script> 
</body>
</html>
