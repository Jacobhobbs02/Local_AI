<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/chat.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="shortcut icon" type="image/x-icon" href="{{url_for('static', filename='favicon.ico') }}">
    <title>Skier's Choice | Chat</title>
</head>
<body>

    <nav class="top-nav">
        <h1> Hello, {{user.full_name}}</h1>
        <a  href="/logout" class="delete">Logout</a>
        <br>
    </nav>

    <section class="display">
    <div class="groups">
        {% for group in groups %}
        <p><a class="group-item" href="/chatroom/{{ group.id }}">{{ group.title }}</a></p>
        {% endfor %}
    </div>

        <section>
            <div class="no-chat">
                <form id="chat-form" action="/chat" method="post" class="col-6 mx-auto"> 
                    <h3>Hello! How can I assist you today?</h3>
                    <div id="loading" style="display: none;">
                        <div class="thinking-ball"></div>
                    </div>
                        <br>
                    <textarea id="prompt" name="prompt" class="input form-control" placeholder="Ask Away!" required></textarea>
                        <br>
                    <input id="submit" type="submit" value="Submit" class="btn btn-light">  
                </form>
            </div>
        </section>
  
      </section>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
