<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/chat.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="shortcut icon" type="image/x-icon" href="{{url_for('static', filename='favicon.ico') }}">
    <title>Skier's Choice | Chat</title>
</head>
<body>
    {% if chats and chats|length > 0 %}
        <section class="full-chat">
            <div class="response" id="response">
                {% for chat in chats %}
                        <div class="user">
                            <p>{{ chat.prompt }}</p>
                        </div>
                 
                        <div class="ai">
                            <p>{{ chat.response }}</p>
                        </div>
                
                {% endfor %}
            </div>

            <div id="loading" style="display: none;">
                <div class="thinking-ball"></div>
            </div>

            <form id="chat-form" action="/chat" method="post" class="col-3 mx-auto"> 
                    <br>
                <textarea id="prompt" name="prompt" class="input form-control" placeholder="Ask Away!" required></textarea>
                    <br>
                <div class="btns">
                    <input id="submit" type="submit" value="Submit" class="btn btn-light">
                    <a  href="/clear-chat" onclick="return deleteChat()" class="delete">New Chat</a>
                </div>
            </form>
        </section>

    {% else %}

        <section>
            <div class="no-chat">
                <form id="chat-form" action="/chat" method="post" class="col-6 mx-auto"> 
                    <h3>Hello! How can I assist you today?</h3>
                    <div id="loading" style="display: none;">
                        <div class="thinking-ball"></div>
                    </div>
                        <br>
                    <textarea id="prompt" name="prompt" class="input form-control" placeholder="Ask Away!" required></textarea>
                        <br>
                    <input id="submit" type="submit" value="Submit" class="btn btn-light">  
                </form>
            </div>
        </section>
    {% endif %}
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
